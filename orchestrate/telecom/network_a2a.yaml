spec_version: v1
kind: external
name: telecom_network_a2a
title: Network Service A2A
nickname: telecom_network_a2a
provider: external_chat/A2A/0.3.0
description: |
  Check service areas, active incidents and future maintenance by area ID and service.
  Invoke this registration for A2A requests.
