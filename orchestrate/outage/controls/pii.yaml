spec_version: v1
kind: control
control:
  artifact_name: pii_filter
  name: kai_outage_pii_20261118
  display_name: KAI | Customer Data Privacy
  description: Native redaction on new outage demo agents only. Independent of workflow approval and optional Agent Identity.
  hooks:
    - agent_pre_invoke
    - agent_post_invoke
  priority: 100
  config:
    detect_email: true
    detect_phone: true
    custom_patterns:
      - 'DEMO-NID-[0-9]{14}'
    # Known non-personal demo references; do not exempt real phone numbers.
    allowlist_patterns:
      - 'OUTAGE-CREDIT-2026\.11-v1|ORDER-KAI-2048'
      - '^(?:2026|2048)$'
      # Exact non-personal event timestamps; no general date or phone exemption.
      - '^2026-11-14(?:T08:00:00Z)?$'
      - '^2026-11-17(?:T08:00:00Z)?$'
      - '^2026-11-18(?:T12:00:00Z)?$'
      - '^2026-10-15(?:T10:00:00Z)?$'
    default_mask_strategy: redact
    redaction_text: '[REDACTED]'
    block_on_detection: false
    log_detections: false
    include_detection_details: true
  agent_names:
    - kai_outage_case_copilot_20261118
    - kai_outage_policy_agent_20261118
    - kai_outage_communications_20261118
